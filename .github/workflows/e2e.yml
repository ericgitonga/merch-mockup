name: E2E

# Gates a PR on the golden-path E2E suite (e2e/) running against a real
# Vercel Preview deployment of this exact PR. Not vercel dev / a hand-run
# local server — this app's mixed Python + Node Functions and its dependency
# on real Vercel Blob storage aren't something a local emulation faithfully
# stands in for (confirmed directly: several real bugs, including a CSP
# violation silently blocking the upload JS entirely, only surfaced when
# testing against an actual deployment). See issue #7.
#
# Requires two repository secrets:
#   VERCEL_TOKEN          — Vercel dashboard -> Account Settings -> Tokens
#   VERCEL_BYPASS_SECRET  — this project's "Protection Bypass for Automation"
#                           secret (Project -> Settings -> Deployment
#                           Protection), since Preview deployments sit behind
#                           Vercel's SSO wall by default.
# org/project IDs below are plain identifiers (same ones in the gitignored
# .vercel/project.json), not secrets.

on:
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: team_zqkuLyNQ340W09pXdT0og99l
  VERCEL_PROJECT_ID: prj_xGcrnQTO0TF36GWB3JGKE5csi9Fe

jobs:
  unit-tests:
    # Fast pure-logic tests (tests/) — no Vercel deploy needed. Required
    # alongside e2e per ONBOARDING.md: "a green E2E run with a red or absent
    # unit-test run is not a passing PR." See issue #24.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/ -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy this PR to a Vercel Preview
        id: deploy
        run: |
          npm install -g vercel
          vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
          url=$(vercel deploy --target preview --yes --token="${{ secrets.VERCEL_TOKEN }}" 2>deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
          cat deploy.log

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright (Python)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run E2E suite against the Preview deployment
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: python e2e/run.py

      - name: Clean up test Blob data
        # Runs regardless of whether the suite above passed or failed —
        # a failed run can still leave real-upload test data behind. The
        # Blob store is shared across every deployment of this project
        # (prod + all Previews alike), and app-level cleanup only covers
        # the download/abandon happy paths, so a blanket wipe here is the
        # backstop against it filling up between daily cron sweeps (see
        # issue #43 — this store has no real end-user data, only test
        # fixtures, so wiping uploads/+results/ outright is safe).
        if: always()
        run: |
          pip install requests
          vercel env pull .env.blob --environment=production --yes --token="${{ secrets.VERCEL_TOKEN }}"
          set -a; source .env.blob; set +a
          python3 - <<'PY'
          import os
          import requests

          token = os.environ["BLOB_READ_WRITE_TOKEN"]
          list_headers = {"authorization": f"Bearer {token}", "x-api-version": "12"}
          deleted = 0
          for prefix in ("uploads/", "results/"):
              cursor = None
              while True:
                  params = {"prefix": prefix, "limit": 1000}
                  if cursor:
                      params["cursor"] = cursor
                  resp = requests.get(
                      "https://vercel.com/api/blob/", headers=list_headers,
                      params=params, timeout=30,
                  )
                  resp.raise_for_status()
                  data = resp.json()
                  urls = [b["url"] for b in data.get("blobs", [])]
                  if urls:
                      del_resp = requests.post(
                          "https://blob.vercel-storage.com/delete",
                          headers={"authorization": f"Bearer {token}"},
                          json={"urls": urls}, timeout=30,
                      )
                      del_resp.raise_for_status()
                      deleted += len(urls)
                  if not data.get("hasMore"):
                      break
                  cursor = data.get("cursor")
          print(f"Deleted {deleted} test blob(s) under uploads/ and results/")
          PY

      - name: Print deploy log
        if: always()
        run: cat deploy.log || true
